<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportStore | Đăng Nhập Quản Trị Viên (Admin Login)</title>
  <meta name="description" content="Trang đăng nhập dành riêng cho Quản trị viên hệ thống SportStore">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/admin/admin-common.css">
  <link rel="stylesheet" href="../css/admin/login-admin.css">
</head>
<body class="admin-login-body">

  <div class="login-container">
    <div class="brand-icon">⚡</div>
    <h1 class="brand-title">SPORT<span>STORE</span> ADMIN</h1>
    <p class="brand-desc">Hệ thống Quản trị & Điều hành Cửa hàng Thể thao</p>

    <!-- FORM ĐĂNG NHẬP -->
    <form class="form-box" onsubmit="return handleFormSubmit(event)">
      <div class="form-group">
        <label for="admin-user">Tài khoản quản trị:</label>
        <input type="text" id="admin-user" value="admin" placeholder="Nhập tài khoản (vd: admin)">
      </div>

      <div class="form-group">
        <label for="admin-pass">Mật khẩu truy cập:</label>
        <input type="password" id="admin-pass" value="123456" placeholder="Nhập mật khẩu (vd: 123456)">
      </div>

      <!-- HỘP TÀI KHOẢN MẪU CHUẨN SGU -->
      <div class="sample-account-box">
        🔑 <strong>Tài khoản mẫu chấm thi SGU:</strong><br>
        Tài khoản: <code>admin</code> | Mật khẩu: <code>123456</code>
      </div>

      <!-- Nút Đăng nhập -->
      <button type="submit" class="btn-submit">
        🚀 Đăng Nhập Quản Trị
      </button>

      <!-- Nút 1-Click đăng nhập nhanh dành cho người chấm -->
      <button type="button" class="btn-quick-login" onclick="quickLoginAdmin()">
        ⚡ Đăng nhập nhanh 1-Click (Chấm thi SGU)
      </button>
    </form>

    <a href="../index.html" class="back-home">
      ← Quay lại Trang Chủ Cửa Hàng
    </a>
  </div>

  <!-- Nạp dữ liệu mock và storage -->
  <script src="../data/mock/categories.data.js"></script>
  <script src="../data/mock/products.data.js"></script>
  <script src="../data/mock/imports.data.js"></script>
  <script src="../data/mock/orders.data.js"></script>
  <script src="../data/mock/customers.data.js"></script>
  <script src="../data/mock/init-storage.js"></script>

  <script>
    /**
     * Hàm xử lý khi submit form đăng nhập admin
     */
    function handleFormSubmit(e) {
      if (e) e.preventDefault();
      dangNhapAdmin();
      return false;
    }

    /**
     * Hàm đăng nhập quản trị viên
     */
    function dangNhapAdmin() {
      var user = document.getElementById("admin-user").value.trim();
      var pass = document.getElementById("admin-pass").value.trim();

      if (!user || !pass) {
        alert("Vui lòng nhập đầy đủ tài khoản và mật khẩu quản trị!");
        return;
      }

      // Chuẩn SGU: admin / 123456
      if (user === "admin" && pass === "123456") {
        localStorage.setItem("admin_logged_in", "true");
        alert("Đăng nhập thành công! Chào mừng Quản Trị Viên SportStore.");
        window.location.href = "admin.html";
      } else {
        alert("Sai tài khoản hoặc mật khẩu! Vui lòng dùng: admin / 123456");
      }
    }

    /**
     * Nút 1-Click đăng nhập ngay lập tức cho GV chấm bài
     */
    function quickLoginAdmin() {
      document.getElementById("admin-user").value = "admin";
      document.getElementById("admin-pass").value = "123456";
      dangNhapAdmin();
    }
  </script>
</body>
</html>
