<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị Viên | SportStore Admin</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/dev5_user.css">
</head>
<body class="admin-login-body">

  <main class="admin-login-card">
    <header class="admin-header">
      <span class="admin-badge"> Quản trị hệ thống</span>
      <h1>⚙️ SPORTSTORE ADMIN</h1>
      <p>Cổng đăng nhập độc lập dành riêng cho Người quản trị / Quản lý cửa hàng</p>
    </header>

   

    <div class="alert-error" id="errorMessage" role="alert"></div>

    <form id="adminLoginForm" novalidate>
      <div class="admin-form-group">
        <label for="adminEmail">Tài khoản Quản trị (Email / SĐT)</label>
        <div class="admin-input-wrapper">
          <span class="admin-input-icon">👤</span>
          <input 
            type="text" 
            id="adminEmail" 
            name="email" 
            placeholder="admin@sportstore.vn" 
            value="admin@sportstore.vn"
            required
            autocomplete="username"
          >
        </div>
      </div>

      <div class="admin-form-group">
        <label for="adminPassword">Mật khẩu Quản trị</label>
        <div class="admin-input-wrapper">
          <span class="admin-input-icon">🔑</span>
          <input 
            type="password" 
            id="adminPassword" 
            name="password" 
            placeholder="••••••••" 
            value="admin123"
            required
            autocomplete="current-password"
          >
        </div>
      </div>

      <button type="submit" class="btn-admin-submit" id="submitBtn">
        <span>Xác Thực &amp; Vào Bảng Quản Trị</span> ➜
      </button>

      <button type="button" class="btn-demo-quick" id="btnFillDemo">
        ⚡ Tự động điền tài khoản Admin mẫu
      </button>
    </form>

    <footer class="admin-footer">
      <a href="../index.html">← Quay về Cửa hàng bán lẻ</a>
    </footer>
  </main>

  <script src="../js/auth_modal.js"></script>
</body>
</html>
